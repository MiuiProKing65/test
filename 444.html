<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lucky Jet — Расширенный анализ прогнозов</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:20px;
}
#circle{
  width:260px;
  height:260px;
  border-radius:50%;
  border:10px solid #111;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:42px;
  font-weight:900;
  transition:0.4s;
}
#circle.green{
  border-color:#00ff66;
  box-shadow:0 0 40px #00ff66;
  animation:pulseGreen 1.2s infinite;
}
#circle.red{
  border-color:#8b0000;
  box-shadow:0 0 50px #8b0000;
  animation:pulseRed 0.8s infinite;
}
@keyframes pulseGreen{
  0%{box-shadow:0 0 20px #00ff66}
  50%{box-shadow:0 0 60px #00ff66}
  100%{box-shadow:0 0 20px #00ff66}
}
@keyframes pulseRed{
  0%{box-shadow:0 0 30px #8b0000}
  50%{box-shadow:0 0 90px #ff0000}
  100%{box-shadow:0 0 30px #8b0000}
}
#coef {
  white-space: pre-line;
  text-align: center;
}
#target{font-size:22px;margin-top:8px;opacity:0.9;}
#action{margin-top:18px;font-size:26px;font-weight:700;}
#status{margin-top:12px;font-size:14px;opacity:0.7;}
#chartContainer{width:90%;max-width:900px;margin-top:30px;}
#history{margin-top:20px;width:100%;max-width:900px;}
#history li{margin-bottom:4px;}
</style>
</head>
<body>

<div id="circle">
  <div id="coef">—</div>
  <div id="target">АНАЛИЗ</div>
</div>
<div id="action">ЖДЁМ ДАННЫЕ…</div>
<div id="status">Раундов: 0</div>

<div id="chartContainer">
  <canvas id="statsChart"></canvas>
</div>

<ul id="history"></ul>

<script>
// ================== НАСТРОЙКИ API ==================
const API_URL = "https://crash-gateway-grm-cr.100hp.app/state";
const API_HEADERS = {
  "customer-id": "077dee8d-c923-4c02-9bee-757573662e69",
  "session-id": "14dd5ed6-64b8-47aa-9fbc-0062522ae77a",
  "accept": "application/json"
};
// ===================================================

let historyData = [];
let lastRoundId = null;
let roundsSince10x = 0;
let intervals10x = [];

const circle = document.getElementById("circle");
const coefEl = document.getElementById("coef");
const actionEl = document.getElementById("action");
const statusEl = document.getElementById("status");
const targetEl = document.getElementById("target");
const historyEl = document.getElementById("history");
const ctx = document.getElementById('statsChart').getContext('2d');
let statsChart;

// ================== ФУНКЦИИ ==================
function updateChart() {
  const labels = historyData.map((_, i)=>`Раунд ${i+1}`);
  const probabilities = historyData.map(d=>d.probability);
  const confidence = historyData.map(d=>d.confidence);
  if(statsChart) statsChart.destroy();
  statsChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets:[
        {label:'Вероятность успеха %', data:probabilities, borderColor:'cyan', fill:false},
        {label:'Уровень уверенности %', data:confidence, borderColor:'orange', fill:false}
      ]
    },
    options:{responsive:true, scales:{y:{beginAtZero:true,max:100}}}
  });
}

function updateHistory() {
  historyEl.innerHTML = '';
  historyData.forEach((d,i)=>{
    const li = document.createElement('li');
    li.textContent = `Раунд ${i+1}: Коэф ${d.coef}x, Вероятность ${d.probability}%, Уверенность ${d.confidence}%, Стратегия ${d.strategy}`;
    historyEl.appendChild(li);
  });
}

function analyze() {
  circle.className="";
  targetEl.textContent="АНАЛИЗ";
  if (historyData.length < 5) { 
    actionEl.textContent = "ЖДЁМ СТАТИСТИКУ"; 
    return; 
  }

  const last5 = historyData.slice(-5);
  const lowCount = last5.filter(x => x.coef < 1.6).length;

  let strategy = "—";
  let recommendedBet = "—";

  if (lowCount >= 3) {
    circle.classList.add("green");
    coefEl.textContent = `1.50x\n~${historyData[historyData.length-1].probability}%`;
    targetEl.textContent = "ЦЕЛЬ";
    strategy = "1.50x STRATEGY";
    recommendedBet = `Ставка: 1.50x, шанс успеха ~${historyData[historyData.length-1].probability}%`;
  } 
  else if (intervals10x.length >= 3) {
    const avg = intervals10x.reduce((a,b)=>a+b,0)/intervals10x.length;
    if (roundsSince10x >= avg-1) {
      circle.classList.add("red");
      coefEl.textContent = `10x\n~${historyData[historyData.length-1].probability}%`;
      targetEl.textContent = "ЛОВИМ";
      strategy = "10x STRATEGY";
      recommendedBet = `Ставка: 10x, шанс успеха ~${historyData[historyData.length-1].probability}%`;
    }
  } else {
    coefEl.textContent = "—";
    recommendedBet = "ЖДЁМ / АНАЛИЗ";
  }

  historyData[historyData.length-1].strategy = strategy;
  actionEl.textContent = recommendedBet;
}

function simulateAIAnalysis(coef) {
  // Простейшая имитация ИИ анализа
  const probability = Math.min(99, Math.max(10, (100 - coef*8 + Math.random()*10))).toFixed(2);
  const confidence = Math.min(99, Math.max(20, (50 + Math.random()*50))).toFixed(2);
  return {probability, confidence};
}

// ================== ПОЛЛИНГ ==================
async function poll(){
  try{
    const r = await fetch(API_URL,{headers:API_HEADERS});
    const d = await r.json();

    const roundId = d.roundConfig?.id;
    const stop = d.stopCoefficients?.slice(-1)[0];

    if(roundId && roundId !== lastRoundId && stop){
      lastRoundId=roundId;
      roundsSince10x++;

      if(stop>=10){
        intervals10x.push(roundsSince10x);
        if(intervals10x.length>5) intervals10x.shift();
        roundsSince10x=0;
      }

      const analysis = simulateAIAnalysis(stop);
      historyData.push({
        coef: stop,
        probability: analysis.probability,
        confidence: analysis.confidence,
        strategy:"—"
      });

      analyze();
      updateHistory();
      updateChart();

      statusEl.textContent=`Раундов: ${historyData.length} | Последний: ${stop.toFixed(2)}x`;
    }
  }catch(e){
    actionEl.textContent="НЕТ СВЯЗИ";
  }
}

setInterval(poll, 1200);
poll();
</script>

</body>
</html>
